<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e20"><meta name="description" content="The Last Swing — món quà đu tơ 3D qua Hà Nội gửi Thủy.">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<title>THE LAST SWING — SPIDER-HÚT · 3D</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<main id="game" aria-label="The Last Swing 3D">
 <canvas id="scene" aria-label="Cảnh thành phố Hà Nội 3D"></canvas>
 <div id="weather-layer" class="weather-layer stage-0" aria-hidden="true"></div>
 <div id="speed-lines" aria-hidden="true"></div>
 <div id="hand-overlay" class="hand-overlay hidden" aria-hidden="true"><img src="./assets/art/fpv-hands-overlay.png" alt=""></div>
 <div id="fx-flash" aria-hidden="true"></div>
 <div class="vignette"></div>
 <div id="hud" class="hidden">
  <div id="stage-banner" aria-live="polite"><span class="stage-number"></span><strong class="stage-name"></strong></div>
  <div class="top-left"><div class="eyebrow"><span id="hud-game-title">THE LAST SWING</span> <b>/ SPIDER-HÚT</b></div><div id="chapter-hud" class="chapter-hud">CHAPTER 01 · FIRST SWING</div></div>
  <div class="top-center"><div class="track"><div id="progress-fill" class="fill"></div><span class="milestone" style="left:33.3%"></span><span class="milestone" style="left:66.7%"></span></div><div id="zone-name">TÂY HỒ · HOÀNG HÔN</div></div>
  <div class="top-right"><div class="eyebrow">LỜI THƯƠNG</div><div id="memory-hud" class="memory-hud">0 / 6 <span>♥</span></div></div>
  <div id="crosshair" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div id="aim-hint">GIỮ SPACE / WEB ĐỂ BẮN TƠ</div>
  <div class="bottom-hud"><div class="speed-row"><span id="speed-text">0 KM/H</span><span id="web-label">TƠ SẴN SÀNG</span></div><div class="meter"><div id="speed-fill"></div></div></div>
  <div class="corner-buttons"><button id="pause-btn" aria-label="Tạm dừng">Ⅱ</button><button id="sound-btn" aria-label="Bật tắt âm thanh">♫</button></div>
 </div>
 <div id="controls" class="hidden"><button data-hold="left" aria-label="Rẽ trái">◀</button><button data-hold="right" aria-label="Rẽ phải">▶</button><button data-hold="web" class="web-btn">WEB</button><button data-hold="boost" class="boost-btn">BOOST</button></div>
 <div id="overlay"><div id="panel" class="panel"></div></div>
 <div id="toast" aria-live="polite"></div>
 <div id="error" class="hidden"></div>
</main>
<!-- Surface startup failures instead of leaving a blank menu. -->
<script>
window.addEventListener('error', function (event) {
 const error = document.getElementById('error');
 if (!error) return;
 error.textContent = 'Trò chơi chưa khởi động được: ' + (event.message || 'Lỗi tải hoặc thực thi JavaScript') + '. Hãy thử Ctrl+Shift+R hoặc mở F12 → Console để xem chi tiết.';
 error.classList.remove('hidden');
});
window.addEventListener('unhandledrejection', function (event) {
 const error = document.getElementById('error');
 if (!error) return;
 error.textContent = 'Trò chơi gặp lỗi khi khởi động: ' + String(event.reason?.message || event.reason || 'Không rõ nguyên nhân');
 error.classList.remove('hidden');
});
</script>
<script src="./gift-settings.js"></script>
<script defer src="./game.bundle.js"></script>
</body>
</html>
